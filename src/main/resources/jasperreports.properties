# Evitar JRFontNotFoundException en servidores Linux donde Helvetica
# no existe como fuente AWT. JasperReports usará métricas por defecto
# durante el fill, mientras iText/OpenPDF renderiza Helvetica como
# fuente PDF estándar (Type1 built-in) sin necesitar el archivo físico.
net.sf.jasperreports.awt.ignore.missing.font=true

# Usar fuente por defecto para medición de texto cuando la fuente
# especificada no está disponible en el entorno AWT del servidor.
net.sf.jasperreports.default.font.name=SansSerif
