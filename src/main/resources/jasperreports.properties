# Ignorar fuentes AWT faltantes en Linux (ej. Helvetica no instalada como fuente AWT).
# JasperReports usará métricas por defecto durante fillReport().
net.sf.jasperreports.awt.ignore.missing.font=true

# Fuente AWT por defecto para medición de texto. SansSerif es una fuente lógica
# de Java siempre disponible, se resuelve a DejaVu/Liberation/etc. según el sistema.
net.sf.jasperreports.default.font.name=SansSerif

# Fuente PDF por defecto: Helvetica es una fuente Type1 estándar incluida en
# OpenPDF/iText sin necesitar archivo externo. Se usa cuando el elemento JRXML
# no especifica pdfFontName o cuando la fuente no está registrada en JasperReports.
net.sf.jasperreports.default.pdf.font.name=Helvetica
net.sf.jasperreports.default.pdf.encoding=Cp1252
net.sf.jasperreports.default.pdf.embedded=false
